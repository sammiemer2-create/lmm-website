<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMM Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="intro"><p class="eyebrow">LMM CONTENT MANAGEMENT</p><h1>网站内容后台｜预览版</h1><p>这里先提供本机预览用的图片替换工具。选择照片后会即时预览；目前不会上传到云端，也不会同步给其他设备。正式后台需要接入安全的储存服务与管理员登录。</p><section><h2>首页主视觉</h2><input type="file" accept="image/*" id="heroFile"><img id="heroPreview" style="display:block;max-width:100%;max-height:360px;margin-top:16px"></section><section><h2>爱的记忆空间图片</h2><input type="file" accept="image/*" id="spaceFile"><img id="spacePreview" style="display:block;max-width:100%;max-height:360px;margin-top:16px"></section><p><a href="index.html">返回网站首页</a></p></main><script>for(const [input,preview,key] of [['heroFile','heroPreview','lmmHeroPreview'],['spaceFile','spacePreview','lmmSpacePreview']]){document.getElementById(input).addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);document.getElementById(preview).src=u;try{localStorage.setItem(key,u)}catch(_){}})}</script></body></html>
